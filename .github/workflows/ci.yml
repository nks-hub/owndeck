name: Verify mobile client
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
jobs:
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [deck_protocol, deck_store]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - run: dart pub get --enforce-lockfile
        working-directory: packages/${{ matrix.package }}
      - run: dart analyze --fatal-infos
        working-directory: packages/${{ matrix.package }}
      - run: dart test
        working-directory: packages/${{ matrix.package }}
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - run: python3 -m unittest discover -s tool -p telemetry_config_test.py
      - run: flutter pub get --enforce-lockfile
        working-directory: apps/mobile
      - run: flutter analyze --no-pub
        working-directory: apps/mobile
      - run: flutter test --no-pub
        working-directory: apps/mobile
  compile:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            runner: ubuntu-latest
          - platform: ios
            runner: macos-15
          - platform: linux
            runner: ubuntu-latest
          - platform: windows
            runner: windows-latest
          - platform: macos
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # connectivity_plus uses NWPath API that only the 26 SDKs provide.
      - name: Select Xcode with the 26 SDKs
        if: matrix.platform == 'ios' || matrix.platform == 'macos'
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
      - name: Free unused hosted Android runner toolchains
        if: matrix.platform == 'android' && runner.environment == 'github-hosted'
        run: |
          for unused in /usr/share/dotnet /usr/share/swift /opt/ghc; do
            if [ -d "$unused" ]; then sudo rm --recursive -- "$unused"; fi
          done
          df -h .
      # clang, cmake, ninja and GTK are Flutter's own Linux list; libsecret is
      # needed by flutter_secure_storage_linux and libcurl by sentry-native.
      - name: Install the Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libsecret-1-dev libcurl4-openssl-dev
      # sentry-native clones submodules whose test data exceed MAX_PATH.
      - name: Allow long paths in git
        if: matrix.platform == 'windows'
        run: git config --global core.longpaths true
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
        working-directory: apps/mobile
      - name: Compile Android without telemetry
        if: matrix.platform == 'android'
        working-directory: apps/mobile
        env:
          GRADLE_OPTS: '-Dorg.gradle.workers.max=2 -Dorg.gradle.jvmargs=-Xmx4G'
        run: flutter build apk --debug --target-platform android-arm64 --no-pub --android-project-arg=candidate=true
      - name: Compile iOS without telemetry
        if: matrix.platform == 'ios'
        working-directory: apps/mobile
        run: flutter build ios --release --no-codesign --no-pub
      - name: Compile Linux without telemetry
        if: matrix.platform == 'linux'
        working-directory: apps/mobile
        run: flutter build linux --release --no-pub
      - name: Compile Windows without telemetry
        if: matrix.platform == 'windows'
        working-directory: apps/mobile
        run: flutter build windows --release --no-pub
      - name: Compile macOS without telemetry
        if: matrix.platform == 'macos'
        working-directory: apps/mobile
        run: flutter build macos --release --no-pub
