name: nextclouddeck
description: Nextcloud Deck client for Android, iOS and desktop.
publish_to: none
version: 0.1.3+6
environment:
  sdk: '>=3.12.2 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^11.0.0
  http: ^1.6.0
  hive: 2.2.3
  url_launcher: ^6.3.2
  deck_protocol:
    path: ../../packages/deck_protocol
  deck_store:
    path: ../../packages/deck_store
  drift_flutter: ^0.3.1
  connectivity_plus: ^7.3.2
  flutter_markdown_plus: ^1.0.12
  markdown: 7.3.1
  camera: ^0.12.1
  zxing2: ^0.2.4
  file_picker: 13.1.0
  path_provider: 2.1.6
  mime: 2.1.0
  uuid: 4.6.0
  open_filex: 5.0.0
  sentry_flutter: 9.30.1
  rybbit_flutter_sdk: 0.4.1
  shared_preferences: 2.5.6
  share_plus: 13.2.0
  package_info_plus: 10.2.2
  sentry: 9.30.1
  workmanager: ^0.10.10
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  crypto: ^3.0.7
  drift: 2.35.3
  shared_preferences_platform_interface: ^2.4.2
flutter:
  uses-material-design: true
  generate: true
