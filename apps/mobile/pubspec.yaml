name: nextclouddeck
description: Nextcloud Deck client for Android and iOS.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.12.2 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^11.0.0
  http: ^1.6.0
  url_launcher: ^6.3.2
  deck_protocol:
    path: ../../packages/deck_protocol
  deck_store:
    path: ../../packages/deck_store
  drift_flutter: ^0.3.1
  connectivity_plus: ^7.3.2
  flutter_markdown_plus: ^1.0.12
  camera: ^0.12.1
  zxing2: ^0.2.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  generate: true
